name: stage5
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      LFS: /mnt/lfs
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /
      - name: Host setup
        run: bash scripts/00-host-setup.sh
      - name: Restore stage4
        run: |
          gh release download v131-stage4 -p stage4.tar.zst
          sudo tar --zstd -xpf stage4.tar.zst -C $LFS
          sudo chown -R $(id -u):$(id -g) $LFS
          rm stage4.tar.zst
          mkdir -p $LFS/sources logs
      - name: Download missing sources
        run: bash scripts/01-sources.sh
      - name: Chroot Setup & Build
        run: sudo bash scripts/10-chroot-setup-stg5.sh
      - name: Unmount & Cleanup
        if: always()
        run: sudo bash scripts/12-unmount-stg5.sh
      - name: Pack
        run: sudo tar -C $LFS --exclude=./sources -I 'zstd -T0 -12' -cf stage5.tar.zst .
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: stage5-logs, path: logs/ }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: v131-stage5, files: stage5.tar.zst }

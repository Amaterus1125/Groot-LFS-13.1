name: stage1
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    env:
      LFS: /mnt/lfs
    steps:
      - uses: actions/checkout@v4
      - name: Host setup
        run: bash scripts/00-host-setup.sh
      - name: Download and verify sources
        run: bash scripts/01-sources.sh
      - name: Toolchain
        run: bash scripts/02-toolchain.sh
      - name: Pack
        run: sudo tar -C $LFS --exclude=./sources --zstd -cf stage1.tar.zst .
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: stage1-logs, path: logs/ }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: stage1, files: stage1.tar.zst }
